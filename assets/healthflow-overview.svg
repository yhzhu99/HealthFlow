<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="healthflowOverviewTitle healthflowOverviewDesc">
  <title id="healthflowOverviewTitle">HealthFlow overview</title>
  <desc id="healthflowOverviewDesc">An electronic health record enters HealthFlow's four-agent loop. Meta plans, Executor builds, Evaluator checks, and Reflector writes validated experience back for the next task, producing a clinical report and reusable memory.</desc>

  <defs>
    <linearGradient id="overviewBackground" x1="0" y1="0" x2="1600" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FBFF"/>
      <stop offset="0.52" stop-color="#EEF7FF"/>
      <stop offset="1" stop-color="#F2FCFA"/>
    </linearGradient>
    <linearGradient id="overviewCenter" x1="520" y1="110" x2="1080" y2="650" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#EAF5FF" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="overviewBlue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="overviewTeal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0D9488"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="overviewViolet" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="overviewAmber" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#D97706"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="overviewShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="overviewSoftShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <marker id="overviewArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#64748B"/>
    </marker>
    <marker id="overviewArrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#2563EB"/>
    </marker>
  </defs>

  <rect width="1600" height="760" rx="40" fill="url(#overviewBackground)"/>
  <circle cx="1390" cy="-40" r="330" fill="#BAE6FD" opacity="0.28"/>
  <circle cx="90" cy="770" r="260" fill="#99F6E4" opacity="0.18"/>
  <path d="M0 132C280 76 470 148 730 103C1034 51 1264 114 1600 48" fill="none" stroke="#fff" stroke-width="2" opacity="0.7"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="80" y="78" fill="#0F172A" font-size="34" font-weight="700">HealthFlow</text>
    <text x="80" y="112" fill="#475569" font-size="18" font-weight="500">A strategically self-evolving workflow for trustworthy EHR analysis</text>
    <text x="1520" y="84" text-anchor="end" fill="#2563EB" font-size="15" font-weight="700" letter-spacing="2.2">NPJ DIGITAL MEDICINE · 2026</text>

    <!-- Input card -->
    <g filter="url(#overviewShadow)">
      <rect x="70" y="190" width="330" height="360" rx="28" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="2"/>
    </g>
    <rect x="98" y="220" width="62" height="62" rx="18" fill="url(#overviewBlue)"/>
    <path d="M116 250h11l6-13 9 27 8-16h12" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="180" y="248" fill="#0F172A" font-size="21" font-weight="700">Clinical question</text>
    <text x="180" y="276" fill="#64748B" font-size="15">EHR data + constraints</text>
    <text x="100" y="332" fill="#64748B" font-size="12" font-weight="700" letter-spacing="1.6">INPUT DATA</text>
    <g fill="#F8FAFC" stroke="#E2E8F0">
      <rect x="100" y="350" width="270" height="40" rx="12"/>
      <rect x="100" y="400" width="270" height="40" rx="12"/>
      <rect x="100" y="450" width="270" height="40" rx="12"/>
    </g>
    <g fill="#2563EB">
      <circle cx="120" cy="370" r="5"/><circle cx="120" cy="420" r="5"/><circle cx="120" cy="470" r="5"/>
    </g>
    <g fill="#334155" font-size="14" font-weight="600">
      <text x="136" y="375">Patient cohort</text><text x="136" y="425">Schema + dataset signature</text><text x="136" y="475">Methodological risk tags</text>
    </g>
    <path d="M400 370H470" fill="none" stroke="#64748B" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#overviewArrow)"/>
    <text x="435" y="349" text-anchor="middle" fill="#64748B" font-size="13" font-weight="600">profile</text>

    <!-- Main loop -->
    <g filter="url(#overviewShadow)">
      <rect x="470" y="150" width="660" height="440" rx="34" fill="url(#overviewCenter)" stroke="#BFDBFE" stroke-width="2"/>
    </g>
    <text x="800" y="200" text-anchor="middle" fill="#0F172A" font-size="15" font-weight="800" letter-spacing="2.2">GOVERNED FOUR-AGENT LOOP</text>
    <text x="800" y="228" text-anchor="middle" fill="#64748B" font-size="14">Each attempt improves the next through validated experience</text>

    <!-- Loop connectors -->
    <path d="M800 280C910 280 1005 302 1005 367" fill="none" stroke="#94A3B8" stroke-width="3" marker-end="url(#overviewArrow)"/>
    <path d="M1005 408C1005 480 910 510 800 510" fill="none" stroke="#94A3B8" stroke-width="3" marker-end="url(#overviewArrow)"/>
    <path d="M760 510C650 510 585 474 585 408" fill="none" stroke="#94A3B8" stroke-width="3" marker-end="url(#overviewArrow)"/>
    <path d="M585 367C585 302 680 280 760 280" fill="none" stroke="#94A3B8" stroke-width="3" marker-end="url(#overviewArrow)"/>

    <!-- Center hub -->
    <circle cx="800" cy="390" r="76" fill="#0F172A" filter="url(#overviewSoftShadow)"/>
    <circle cx="800" cy="390" r="61" fill="url(#overviewBlue)"/>
    <path d="M770 391h16l8-17 12 34 11-22h20" fill="none" stroke="#DFFBFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="800" y="439" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">HealthFlow</text>

    <!-- Agent nodes -->
    <g filter="url(#overviewSoftShadow)">
      <rect x="630" y="250" width="150" height="74" rx="18" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="2"/>
      <rect x="820" y="250" width="150" height="74" rx="18" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="2"/>
      <rect x="820" y="456" width="150" height="74" rx="18" fill="#FFFBEB" stroke="#FDE68A" stroke-width="2"/>
      <rect x="630" y="456" width="150" height="74" rx="18" fill="#F0FDFA" stroke="#99F6E4" stroke-width="2"/>
    </g>
    <circle cx="655" cy="275" r="10" fill="url(#overviewBlue)"/><circle cx="845" cy="275" r="10" fill="url(#overviewViolet)"/><circle cx="845" cy="481" r="10" fill="url(#overviewAmber)"/><circle cx="655" cy="481" r="10" fill="url(#overviewTeal)"/>
    <g fill="#0F172A" font-size="16" font-weight="800">
      <text x="675" y="281">Meta</text><text x="865" y="281">Executor</text><text x="865" y="487">Evaluator</text><text x="675" y="487">Reflector</text>
    </g>
    <g fill="#64748B" font-size="12" font-weight="600">
      <text x="655" y="304">plan with memory</text><text x="845" y="304">build artifacts</text><text x="845" y="510">check validity</text><text x="655" y="510">write back safeguards</text>
    </g>

    <!-- Output card -->
    <path d="M1130 370H1200" fill="none" stroke="#2563EB" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#overviewArrowBlue)"/>
    <text x="1165" y="349" text-anchor="middle" fill="#2563EB" font-size="13" font-weight="700">deliver</text>
    <g filter="url(#overviewShadow)">
      <rect x="1200" y="190" width="330" height="360" rx="28" fill="#FFFFFF" stroke="#CCFBF1" stroke-width="2"/>
    </g>
    <rect x="1228" y="220" width="62" height="62" rx="18" fill="url(#overviewTeal)"/>
    <path d="M1246 244h26M1246 256h26M1246 268h17" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <text x="1310" y="248" fill="#0F172A" font-size="21" font-weight="700">Trustworthy result</text>
    <text x="1310" y="276" fill="#64748B" font-size="15">Artifacts + reusable experience</text>
    <text x="1230" y="332" fill="#64748B" font-size="12" font-weight="700" letter-spacing="1.6">OUTPUTS</text>
    <g fill="#F0FDFA" stroke="#CCFBF1">
      <rect x="1230" y="350" width="270" height="54" rx="14"/>
      <rect x="1230" y="418" width="270" height="54" rx="14"/>
    </g>
    <circle cx="1254" cy="377" r="8" fill="url(#overviewTeal)"/><circle cx="1254" cy="445" r="8" fill="url(#overviewViolet)"/>
    <g fill="#0F172A" font-size="15" font-weight="700">
      <text x="1274" y="373">Clinical analysis report</text><text x="1274" y="441">Experience memory</text>
    </g>
    <g fill="#64748B" font-size="12">
      <text x="1274" y="392">methods · results · limitations</text><text x="1274" y="460">safeguards · workflows · anchors</text>
    </g>
    <rect x="1230" y="492" width="270" height="30" rx="15" fill="#ECFDF5"/>
    <text x="1365" y="512" text-anchor="middle" fill="#047857" font-size="12" font-weight="700">validated before reuse</text>

    <!-- Bottom caption -->
    <path d="M400 650H1200" stroke="#CBD5E1" stroke-width="2"/>
    <circle cx="520" cy="650" r="5" fill="#2563EB"/><circle cx="800" cy="650" r="5" fill="#7C3AED"/><circle cx="1080" cy="650" r="5" fill="#0D9488"/>
    <text x="800" y="696" text-anchor="middle" fill="#334155" font-size="17" font-weight="600">Plan → execute → evaluate → reflect → better next attempt</text>
  </g>
</svg>
